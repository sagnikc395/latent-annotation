[project]
name = "latent-annotation"
version = "0.1.0"
description = "Agent-based annotation of SAE latents over protein language models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tooluniverse",
    "huggingface-hub>=1.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["latent_annotation"]
